name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        python-version: [ '3.9', '3.11', '3.12' ]
        node-version: [ '20.x' ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Verify Vault Status
        run: python memory-vault/memory.py status

      - name: Test Grounding Context Output
        run: python memory-vault/memory.py context

      - name: Test FTS5 Peek Recall
        run: python memory-vault/memory.py recall "profile"

      - name: Test CLI Bridge Execution
        run: node bin/cli.js status
